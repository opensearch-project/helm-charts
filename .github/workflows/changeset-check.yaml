name: Changeset Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect chart and changeset changes
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            charts:
              - 'charts/**'
              - '!charts/*/changeset/**'
            changeset:
              - 'charts/*/changeset/**'

      - name: Require a changeset when a chart changes
        if: steps.changed.outputs.charts_any_changed == 'true' && steps.changed.outputs.changeset_any_changed != 'true'
        run: |
          echo "::error::Chart changed but no changeset added. Copy a chart's changeset/example.md and describe your change."
          exit 1
